services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: seatsync-sql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - seatsync_sql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  seatsync_sql_data:
